name: CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  GO_VERSION: "1.24.x"

jobs:
  quality:
    name: Build and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Run unit tests
        run: go test -race ./...

      - name: Build application
        run: go build -trimpath -o /tmp/person-service ./cmd/person-service

  image:
    name: Build and publish Docker image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:production
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Schema, deploy and integration tests
    if: github.event_name != 'pull_request' && vars.RAILWAY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    concurrency:
      group: railway-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_PUBLIC_URL }}
      RAILWAY_BASE_URL: ${{ vars.RAILWAY_BASE_URL }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Railway configuration
        run: |
          for variable in RAILWAY_TOKEN RAILWAY_DATABASE_URL RAILWAY_BASE_URL RAILWAY_SERVICE_ID; do
            if [ -z "${!variable}" ]; then
              echo "Missing GitHub secret or variable: $variable"
              exit 1
            fi
          done

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply database schema
        run: psql "$RAILWAY_DATABASE_URL" --set ON_ERROR_STOP=1 --file postgres/schema/01-persons.sql

      - name: Deploy image to Railway
        id: railway-deploy
        run: |
          api_url="https://backboard.railway.com/graphql/v2"
          token_response="$(curl --fail-with-body --silent --show-error \
            --request POST "$api_url" \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"query":"query { projectToken { environmentId } }"}')"

          if ! echo "$token_response" | jq --exit-status '.errors == null and .data.projectToken.environmentId != null' >/dev/null; then
            echo "$token_response"
            exit 1
          fi
          environment_id="$(echo "$token_response" | jq --raw-output '.data.projectToken.environmentId')"

          deploy_payload="$(jq --null-input \
            --arg serviceId "$RAILWAY_SERVICE_ID" \
            --arg environmentId "$environment_id" \
            '{
              query: "mutation Deploy($serviceId: String!, $environmentId: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId) }",
              variables: {serviceId: $serviceId, environmentId: $environmentId}
            }')"
          deploy_response="$(curl --fail-with-body --silent --show-error \
            --request POST "$api_url" \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$deploy_payload")"

          if ! echo "$deploy_response" | jq --exit-status '.errors == null and .data.serviceInstanceDeployV2 != null' >/dev/null; then
            echo "$deploy_response"
            exit 1
          fi
          deployment_id="$(echo "$deploy_response" | jq --raw-output '.data.serviceInstanceDeployV2')"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Railway deployment
        env:
          DEPLOYMENT_ID: ${{ steps.railway-deploy.outputs.deployment_id }}
        run: |
          api_url="https://backboard.railway.com/graphql/v2"
          status_payload="$(jq --null-input \
            --arg id "$DEPLOYMENT_ID" \
            '{
              query: "query Deployment($id: String!) { deployment(id: $id) { status } }",
              variables: {id: $id}
            }')"
          for attempt in $(seq 1 60); do
            status_response="$(curl --fail-with-body --silent --show-error \
              --request POST "$api_url" \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$status_payload")"
            if ! echo "$status_response" | jq --exit-status '.errors == null and .data.deployment.status != null' >/dev/null; then
              echo "$status_response"
              exit 1
            fi
            status="$(echo "$status_response" | jq --raw-output '.data.deployment.status')"
            echo "Deployment status: $status"
            case "$status" in
              SUCCESS)
                exit 0
                ;;
              FAILED|CRASHED|REMOVED)
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for Railway deployment"
          exit 1

      - name: Wait for service
        run: |
          base_url="${RAILWAY_BASE_URL%/}"
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 5 --retry-all-errors \
            "$base_url/health"

      - name: Install Newman
        run: npm install --global newman@6.2.1

      - name: Run API integration tests
        run: |
          base_url="${RAILWAY_BASE_URL%/}"
          newman run "postman/[inst] Lab1.postman_collection.json" \
            --environment "postman/[inst][heroku] Lab1.postman_environment.json" \
            --env-var "baseUrl=$base_url"

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true
        env:
          RAILWAY_BASE_URL: ${{ vars.RAILWAY_BASE_URL }}

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 1
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"
